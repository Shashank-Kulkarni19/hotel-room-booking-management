services:
  # Backend Service
  - type: web
    name: hotel-backend
    runtime: docker
    env: docker
    rootDir: backend
    plan: free # Change to 'starter' if you need more RAM
    healthCheckPath: /api/rooms # Or any public endpoint
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false # You will provide your MySQL URL here
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Generates a random secure secret
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: PORT
        value: 8080

  # Frontend Service
  - type: web
    name: hotel-frontend
    runtime: docker
    env: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: hotel-backend
          type: web
          property: host
        # We append /api to the host provided by Render
        value: ${hotel-backend.host}/api
